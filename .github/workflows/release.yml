# Build extension packages on v* tags or manual runs; publish tagged builds to GitHub Releases.
# Users can download ZIP files for manual installation alongside store distribution.
# See docs/publishing.md for details.
name: Release extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and release extension packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Release convention: update package.json, then create a matching vX.Y.Z tag.
      # Reject mismatched tags so release and package versions cannot diverge.
      # Manual runs have no tag: skip version validation and build without publishing.
      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "Error: tag version ($TAG) does not match package.json version ($VER)"
            exit 1
          fi

      - name: Type-check extension
        run: npm run typecheck:ext

      - name: Build and package Chrome, Firefox, and source archives
        run: |
          npx wxt zip
          npx wxt -b firefox zip

      # Verify the Firefox source archive contains no sensitive .dev.vars or .env files.
      - name: Check source archive for sensitive files
        run: |
          if unzip -l .output/*-sources.zip | grep -qE '(\.dev\.vars|\.env)$'; then
            echo "Error: source archive contains sensitive files; release aborted"
            exit 1
          fi

      # Upload artifacts so manually triggered builds can be downloaded from the workflow run.
      # Tagged releases still use softprops below to publish to GitHub Releases.
      # upload-artifact ignores hidden directories by default, including glob matches.
      # Our archives live in the hidden .output directory.
      # Enable include-hidden-files explicitly; repository metadata is still excluded.
      - name: Upload build artifacts for manual download
        uses: actions/upload-artifact@v4
        with:
          name: bookmark-nav-extension-zips
          path: .output/*.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # Publish only on tag pushes; manual runs validate builds without creating a Release.
      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Bookmark Nav Extension ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
            .output/*-sources.zip
