# Continuous integration: run extension quality checks on every push and pull request.
# Catch type errors, build failures, and lint issues before publishing artifacts.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Extension type check, build, and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # package.json allowScripts permits esbuild, better-sqlite3, and workerd install scripts.
      # npm 11 applies this allowlist during npm ci without additional intervention.
      - name: Install dependencies
        run: npm ci

      - name: Type-check extension
        run: npm run typecheck:ext

      - name: Build extension (Chrome)
        run: npm run build:ext

      - name: Build extension (Firefox)
        run: npm run build:ext:firefox

      - name: Lint
        run: npm run lint
